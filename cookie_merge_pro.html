<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Cookie Merge Pro</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#050308;touch-action:none}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif;color:#fff}
canvas{position:fixed;inset:0;width:100vw;height:100vh}
.ui{position:fixed;z-index:5;left:0;right:0;pointer-events:none}
.top{top:max(12px,env(safe-area-inset-top));display:flex;justify-content:space-between;padding:0 13px}
.pill{padding:9px 13px;border-radius:18px;background:#09070dcc;border:1px solid #ffffff14;box-shadow:0 5px 25px #0008;font-weight:800;font-size:16px}
#next{top:74px;left:50%;transform:translateX(-50%);display:none;padding:6px 12px;border-radius:18px;background:#08060acc;border:1px solid #fff2;font-size:14px;font-weight:700}
.overlay{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;background:radial-gradient(circle at 50% 38%,#2a1550 0,#0a0710 48%,#000 100%);padding:25px}
.overlay.hide{display:none}
.logo{font-size:92px;filter:drop-shadow(0 0 20px #ff5bc8aa);margin-bottom:5px}
h1{font-size:44px;line-height:1;margin:0 0 14px;font-weight:900;letter-spacing:-2px}
.sub{font-size:18px;color:#c8c2d1;margin:0 0 30px}
.btn{border:0;border-radius:22px;padding:17px 36px;background:#fff;color:#111;font-size:19px;font-weight:900;box-shadow:0 8px 30px #0008}
.btn:active{transform:scale(.97)}
.small{margin-top:17px;color:#8f879b;font-size:12px}
#toast{position:fixed;z-index:15;left:50%;top:47%;transform:translate(-50%,-50%) scale(.8);opacity:0;font-size:30px;font-weight:900;pointer-events:none;text-shadow:0 3px 20px #000}
#toast.show{animation:pop .55s ease-out}
@keyframes pop{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-50%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) scale(1)}}
</style>
</head>
<body>
<canvas id="game"></canvas>
<div class="ui top"><div class="pill">🍪 COOKIE MERGE</div><div class="pill">Счёт: <span id="score">0</span></div></div>
<div class="ui" id="next">Следующий: 🍪</div>

<div class="overlay" id="menu">
  <div class="logo">🍩</div><h1>Cookie Merge</h1>
  <p class="sub">Соединяй одинаковые сладости</p>
  <button class="btn" id="start">НАЧАТЬ ИГРУ</button>
  <div class="small">Нажми на нужное место, чтобы бросить сладость</div>
</div>
<div class="overlay hide" id="gameover">
  <div class="logo">💥</div><h1>Игра окончена</h1>
  <p class="sub">Счёт: <b id="final">0</b></p>
  <button class="btn" id="restart">ИГРАТЬ СНОВА</button>
</div>
<div id="toast">+20</div>

<script>
'use strict';
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
let W=innerWidth,H=innerHeight,DPR=1;
const TYPES=[
 {e:'🍪',r:18,pts:10},{e:'🧁',r:23,pts:20},{e:'🍩',r:29,pts:40},
 {e:'🍰',r:36,pts:80},{e:'🍫',r:44,pts:160},{e:'🍦',r:53,pts:320},
 {e:'🍭',r:63,pts:640},{e:'🍉',r:74,pts:1280},{e:'🍍',r:87,pts:2560}
];
let box={x:0,y:0,w:0,h:0},balls=[],particles=[],score=0,next=0,playing=false;
let pointerX=0,dropWait=0,last=0,highTimer=0,shake=0;

function resize(){
 DPR=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;
 canvas.width=W*DPR;canvas.height=H*DPR;ctx.setTransform(DPR,0,0,DPR,0,0);
 box.w=Math.min(W*.88,410); box.h=Math.min(H*.68,690);
 box.x=(W-box.w)/2; box.y=Math.max(145,H*.17);
 pointerX=pointerX||W/2;
}
addEventListener('resize',resize);resize();

function randNext(){next=Math.floor(Math.random()*5)}
function updateNext(){document.getElementById('next').textContent='Следующий: '+TYPES[next].e}
function newBall(x){
 const r=TYPES[next].r;
 balls.push({x:Math.max(box.x+r,Math.min(box.x+box.w-r,x)),y:box.y+22,r,lv:next,vx:0,vy:0,dead:false});
 randNext();updateNext();
}
function startGame(){
 balls=[];particles=[];score=0;next=0;randNext();updateNext();
 document.getElementById('score').textContent='0';
 document.getElementById('menu').classList.add('hide');
 document.getElementById('gameover').classList.add('hide');
 document.getElementById('next').style.display='block';
 playing=true;dropWait=.35;highTimer=0;
 newBall(box.x+box.w/2);
}
document.getElementById('start').onclick=startGame;
document.getElementById('restart').onclick=startGame;

function setPointer(e){
 const x=e.touches?e.touches[0].clientX:e.clientX;
 pointerX=Math.max(box.x+10,Math.min(box.x+box.w-10,x));
}
canvas.addEventListener('pointermove',setPointer,{passive:true});
canvas.addEventListener('pointerdown',e=>{
 setPointer(e);
 if(playing&&dropWait<=0){newBall(pointerX);dropWait=.48}
});
canvas.addEventListener('touchmove',e=>{setPointer(e);e.preventDefault()},{passive:false});
canvas.addEventListener('touchstart',e=>{setPointer(e);e.preventDefault()},{passive:false});

function burst(x,y,lv){
 for(let i=0;i<14;i++){
  const a=Math.random()*Math.PI*2,s=60+Math.random()*190;
  particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s-50,life:.55,max:.55,lv});
 }
 shake=Math.min(7,shake+2);
}
function merge(a,b){
 if(a.lv!==b.lv||a.dead||b.dead)return false;
 a.dead=b.dead=true;
 const lv=a.lv+1;
 burst((a.x+b.x)/2,(a.y+b.y)/2,lv);
 if(lv<TYPES.length){
  const x=(a.x+b.x)/2,y=(a.y+b.y)/2;
  balls.push({x,y,r:TYPES[lv].r,lv,vx:(a.vx+b.vx)/2,vy:-260,dead:false});
  score+=TYPES[lv].pts;
  toast('+'+TYPES[lv].pts);
 }else{score+=5000;toast('MAX!')}
 document.getElementById('score').textContent=score;
 return true;
}
function toast(t){
 const el=document.getElementById('toast');el.textContent=t;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');
}
function physics(dt){
 const g=940;
 for(const b of balls){
  b.vy+=g*dt;b.vx*=.994;b.vy*=.999;b.x+=b.vx*dt;b.y+=b.vy*dt;
  const L=box.x+b.r,R=box.x+box.w-b.r,B=box.y+box.h-b.r;
  if(b.x<L){b.x=L;b.vx=Math.abs(b.vx)*.45}
  if(b.x>R){b.x=R;b.vx=-Math.abs(b.vx)*.45}
  if(b.y>B){b.y=B;b.vy=-Math.abs(b.vy)*.23}
 }
 for(let i=0;i<balls.length;i++)for(let j=i+1;j<balls.length;j++){
  const a=balls[i],b=balls[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;
  if(d<min){
   if(a.lv===b.lv&&d<min*.92){merge(a,b);continue}
   const nx=dx/d,ny=dy/d,o=min-d;
   a.x-=nx*o*.5;a.y-=ny*o*.5;b.x+=nx*o*.5;b.y+=ny*o*.5;
   const rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
   if(rel<0){const imp=-rel*.30;a.vx-=nx*imp;a.vy-=ny*imp;b.vx+=nx*imp;b.vy+=ny*imp}
  }
 }
 balls=balls.filter(b=>!b.dead);
 for(const p of particles){p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=600*dt;p.life-=dt}
 particles=particles.filter(p=>p.life>0);
 const high=balls.some(b=>b.y-b.r<box.y+47&&Math.abs(b.vy)<35);
 highTimer=high?highTimer+dt:Math.max(0,highTimer-dt*2);
 if(highTimer>1.7)endGame();
 shake*=.9;
}
function roundRect(x,y,w,h,r){
 ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath();
}
function draw(){
 ctx.clearRect(0,0,W,H);
 const bg=ctx.createRadialGradient(W/2,H*.44,0,W/2,H*.44,Math.max(W,H)*.78);
 bg.addColorStop(0,'#24123c');bg.addColorStop(.52,'#0d0716');bg.addColorStop(1,'#000');
 ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
 ctx.save();
 if(shake>.2)ctx.translate((Math.random()-.5)*shake,(Math.random()-.5)*shake);
 // glass container
 ctx.shadowColor='#bca0ff';ctx.shadowBlur=18;ctx.strokeStyle='#d8c6ff';ctx.lineWidth=5;
 roundRect(box.x,box.y,box.w,box.h,box.w*.44);ctx.stroke();ctx.shadowBlur=0;
 ctx.strokeStyle='#e1d5ff';ctx.lineWidth=5;ctx.beginPath();
 ctx.moveTo(box.x+box.w*.42,box.y);ctx.lineTo(box.x+box.w*.42,box.y-88);
 ctx.moveTo(box.x+box.w*.58,box.y);ctx.lineTo(box.x+box.w*.58,box.y-88);ctx.stroke();
 // danger line
 ctx.strokeStyle='#ff668055';ctx.lineWidth=1;ctx.setLineDash([6,7]);ctx.beginPath();
 ctx.moveTo(box.x+10,box.y+47);ctx.lineTo(box.x+box.w-10,box.y+47);ctx.stroke();ctx.setLineDash([]);
 // aim
 if(playing){ctx.shadowColor='#fff';ctx.shadowBlur=14;ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(pointerX,box.y-13,5,0,Math.PI*2);ctx.fill();ctx.shadowBlur=0}
 // particles
 for(const p of particles){
  ctx.globalAlpha=Math.max(0,p.life/p.max);ctx.fillStyle='#ffd6f4';ctx.beginPath();ctx.arc(p.x,p.y,2.2,0,Math.PI*2);ctx.fill();
 }
 ctx.globalAlpha=1;
 // sweets
 for(const b of balls){
  const t=TYPES[b.lv];
  ctx.save();ctx.translate(b.x,b.y);
  ctx.shadowColor='#ff76d5';ctx.shadowBlur=15;
  ctx.font=`${Math.max(18,b.r*1.45)}px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif`;
  ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(t.e,0,2);
  ctx.restore();
 }
 ctx.restore();
}
function endGame(){
 playing=false;document.getElementById('final').textContent=score;document.getElementById('gameover').classList.remove('hide');
}
function frame(t){
 const dt=Math.min((t-last)/1000,.032);last=t;
 if(playing){dropWait=Math.max(0,dropWait-dt);physics(dt)}
 draw();requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</body>
</html>
