<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05030a">
<title>Merge World</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05030a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;touch-action:none}
#app{position:fixed;inset:0;overflow:hidden;background:radial-gradient(circle at 50% 20%,#5b2813 0,#241008 32%,#0b0505 75%,#030204 100%);transition:background .35s}
#app.mode2{background:#000}
.top{position:absolute;z-index:20;top:max(7px,env(safe-area-inset-top));left:8px;right:8px;display:grid;grid-template-columns:1fr 1.08fr 1fr;gap:6px}
.panel{min-width:0;border:1px solid #e7c37d77;border-radius:17px;background:#180a05cc;box-shadow:inset 0 1px #fff3,0 5px 20px #000b;padding:6px;text-align:center;backdrop-filter:blur(5px)}
.mode2 .panel{border-color:#c8aaff55;background:#050509dd}
.logo{font-weight:1000;font-size:16px;line-height:1;color:#ffd273;text-shadow:0 2px #692504,0 0 12px #ff9c39}
.mode2 .logo{color:#fff;text-shadow:0 0 15px #b875ff}
.logo span{display:block;font-size:9px;letter-spacing:2px;margin-top:3px;color:#fff0c9}
.scoreLabel{font-size:9px;color:#f3d6a0;font-weight:800}.score{font-size:25px;line-height:1.05;font-weight:1000;color:#ffd34c;text-shadow:0 3px #74300a}
.mode2 .score{color:#fff;text-shadow:0 0 14px #bc7aff}.mode2 .scoreLabel{color:#cbbbe0}
.nextLabel{font-size:9px;color:#f3d6a0;font-weight:800}.nextEmoji{font-size:23px;line-height:1}
.mode2 .nextLabel{color:#cbbbe0}
.controls{position:absolute;z-index:22;top:max(76px,calc(env(safe-area-inset-top) + 64px));left:10px;right:10px;display:flex;justify-content:space-between}
.group{display:flex;gap:7px}
.ctrl{width:41px;height:41px;border-radius:50%;border:1px solid #efbd7088;background:#160a05e8;color:#fff;font-size:18px;box-shadow:inset 0 1px #fff3,0 4px 15px #0009}
.mode2 .ctrl{border-color:#c6a5ff77;background:#05050be8}
.ctrl:active{transform:scale(.92)}
.modeBtn{position:absolute;z-index:23;top:max(77px,calc(env(safe-area-inset-top) + 65px));left:50%;transform:translateX(-50%);padding:8px 12px;border-radius:20px;border:1px solid #efbd7088;background:#160a05ee;color:#fff;font-weight:900;font-size:11px;white-space:nowrap;box-shadow:0 4px 14px #0009}
.mode2 .modeBtn{border-color:#c6a5ff77;background:#05050be8}
.categories{position:absolute;z-index:24;left:8px;right:8px;top:max(120px,calc(env(safe-area-inset-top) + 108px));display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px}
.categories::-webkit-scrollbar{display:none}
.cat{flex:0 0 auto;border:1px solid #e6b76a66;border-radius:15px;padding:6px 9px;background:#190b06dd;color:#e8d4bd;font-weight:800;font-size:11px}
.cat.active{background:#8d4b18;color:#fff;border-color:#ffc875}
.mode2 .cat{border-color:#a987d855;background:#05050bdd}.mode2 .cat.active{background:#4b2873;border-color:#c89cff}
.stage{position:absolute;z-index:2;left:50%;transform:translateX(-50%);top:calc(max(159px,env(safe-area-inset-top) + 147px));bottom:max(70px,calc(env(safe-area-inset-bottom) + 62px));width:min(94vw,430px)}
.container{position:absolute;inset:0;overflow:hidden}
.jar{border:4px solid #ffd98c;border-radius:19% 19% 11% 11%;background:linear-gradient(90deg,#fff2,#ffffff05 10%,#160b08aa 50%,#ffffff05 90%,#fff2);box-shadow:0 0 0 2px #fff4,0 0 30px #ffbd4d66,inset 8px 0 20px #fff2,inset -8px 0 20px #fff1}
.jar:before{content:"";position:absolute;left:-6px;right:-6px;top:-5px;height:45px;border:4px solid #ffe6b2;border-radius:50%;box-shadow:0 0 18px #ffc35e99,inset 0 0 10px #fff5}
.jar:after{content:"";position:absolute;left:10px;top:11%;bottom:9%;width:4px;border-radius:4px;background:#fff8;opacity:.55}
.jar .neck{position:absolute;left:35%;right:35%;top:-73px;height:75px;border-left:4px solid #ffd98c;border-right:4px solid #ffd98c}
.flask{background:#000}
.flask .body{position:absolute;left:2%;right:2%;bottom:1%;height:73%;border:4px solid #d8b6ff;border-radius:49% 49% 50% 50%/49% 49% 45% 45%;background:#000;box-shadow:0 0 0 2px #fff2,0 0 34px #a56bff88,inset 0 0 20px #6c39a844}
.flask .neck{position:absolute;left:34%;right:34%;top:0;height:31%;border-left:4px solid #d8b6ff;border-right:4px solid #d8b6ff;box-shadow:0 0 16px #a56bff77}
.flask .lip{position:absolute;left:34%;right:34%;top:0;border-top:4px solid #d8b6ff;box-shadow:0 0 13px #a56bff88}
.danger{position:absolute;left:9px;right:9px;top:15%;border-top:2px dashed #ff9d2eaa}
.mode2 .danger{border-color:#b86cffaa}
.aim{position:absolute;z-index:4;left:50%;top:-25px;height:118px;border-left:3px dashed #fff9}
.aimDot{position:absolute;z-index:5;left:50%;top:-36px;width:12px;height:12px;border-radius:50%;background:#fff;box-shadow:0 0 18px #fff;transform:translateX(-50%)}
#pieces,#pieces2{position:absolute;inset:0}
.piece{position:absolute;display:flex;align-items:center;justify-content:center;user-select:none;will-change:transform;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;filter:drop-shadow(0 7px 5px #000b)}
.mode2 .piece{filter:drop-shadow(0 0 9px #ff8b2e) drop-shadow(0 6px 4px #000)}
.piece.pop{animation:pop .2s ease-out}
@keyframes pop{0%{transform:scale(.35)}70%{transform:scale(1.16)}100%{transform:scale(1)}}
.burst{position:absolute;z-index:30;pointer-events:none;font-size:25px;animation:burst .6s ease-out forwards}
@keyframes burst{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(-50%,-100px) scale(1.7)}}
.bottom{position:absolute;z-index:25;left:8px;right:8px;bottom:max(6px,env(safe-area-inset-bottom));height:50px;border:1px solid #e7b56b66;border-radius:16px;background:#180a05ee;display:flex;align-items:center;justify-content:space-evenly;box-shadow:inset 0 1px #fff2,0 5px 18px #000a}
.mode2 .bottom{border-color:#aa82db66;background:#050509ee}
.level{font-size:20px;position:relative;text-shadow:0 0 8px #fff}.level:after{content:"›";position:absolute;right:-10px;top:3px;font-size:14px;color:#ffc76d}.level:last-child:after{display:none}

.coverCard{position:relative;width:min(92vw,390px);padding:22px 14px 20px;border:1px solid #ffc96f88;border-radius:30px;background:linear-gradient(180deg,#2b1007ee,#100504f2 78%);box-shadow:0 0 45px #ff8b2e33,inset 0 1px #fff4;overflow:hidden}
.coverTitle{position:relative;z-index:3;font-size:49px;line-height:.78;font-weight:1000;letter-spacing:-2px;text-shadow:0 4px #632200,0 0 22px #ff9b39}
.coverTitle span{display:block;color:#ffe1a0}.coverTitle b{display:block;color:#ff9d2e}
.coverTag{position:relative;z-index:3;margin-top:12px;font-size:9px;letter-spacing:2px;color:#ffe4b4;font-weight:900}
.coverScene{position:relative;height:210px;margin:13px auto 5px;max-width:350px;border-radius:28px;background:radial-gradient(circle at 50% 52%,#8b3f16 0,#3a1609 32%,#120605 72%);border:1px solid #ffbd6255;box-shadow:inset 0 0 35px #ff8c2e22,0 8px 25px #0008}
.coverCore{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:86px;height:86px;display:flex;align-items:center;justify-content:center;font-size:61px;border-radius:50%;background:#1c0b06;box-shadow:0 0 0 2px #ffd37a,0 0 28px #ff9b35,0 0 70px #ff6f1844;z-index:2}
.coverOrb{position:absolute;width:54px;height:54px;display:flex;align-items:center;justify-content:center;font-size:37px;border-radius:50%;background:#140a08aa;box-shadow:0 0 18px #ff9c3d66;border:1px solid #ffd28b44;animation:floatOrb 3.2s ease-in-out infinite}
.coverOrb.o1{left:8%;top:15%;animation-delay:-.2s}.coverOrb.o2{left:30%;top:6%;animation-delay:-1.1s}.coverOrb.o3{right:8%;top:14%;animation-delay:-1.8s}.coverOrb.o4{left:5%;bottom:12%;animation-delay:-2.4s}.coverOrb.o5{left:34%;bottom:5%;animation-delay:-.7s}.coverOrb.o6{right:6%;bottom:12%;animation-delay:-1.5s}.coverOrb.o7{right:30%;top:5%;animation-delay:-2.1s}.coverOrb.o8{left:17%;top:44%;animation-delay:-.9s}
@keyframes floatOrb{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-8px) rotate(3deg)}}
.coverTypes{position:relative;z-index:3;display:grid;grid-template-columns:1fr 1fr;gap:5px;margin:9px auto 12px;max-width:350px}
.coverTypes span{padding:7px 4px;border-radius:12px;background:#100705bb;border:1px solid #ffc36a33;color:#ffe1b1;font-size:9px;font-weight:900}
.coverCard .sub{font-size:12px;line-height:1.35;margin:8px 0 15px;color:#e9d5c2}
.coverCard .btn{min-width:190px;font-size:18px;letter-spacing:.4px}
.coverGlow{position:absolute;width:180px;height:180px;border-radius:50%;filter:blur(35px);opacity:.32}
.g1{background:#ff7b20;left:-50px;top:15%}.g2{background:#7f3dff;right:-60px;top:35%}.g3{background:#ffbd45;left:35%;bottom:-90px}
.overlay{position:absolute;z-index:40;inset:0;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:radial-gradient(circle at 50% 35%,#6c3013,#180905 55%,#030203)}
.overlay.hidden{display:none}.mode2 .overlay{background:radial-gradient(circle at 50% 35%,#21102d,#050309 60%,#000)}
.card{max-width:340px}.big{font-size:72px;filter:drop-shadow(0 8px 12px #000)}
h1{margin:4px 0 8px;font-size:42px;line-height:.95;color:#ffd36d;text-shadow:0 3px #6d2a05,0 0 18px #ff9f43}.mode2 h1{color:#fff;text-shadow:0 0 20px #b46cff}
.sub{color:#e5d2c2;margin:0 0 22px}.btn{border:1px solid #fff8;border-radius:20px;padding:15px 28px;background:linear-gradient(#ffe5a6,#ffae28);color:#421900;font-size:17px;font-weight:1000;box-shadow:0 8px 25px #000a}
.mode2 .btn{background:linear-gradient(#e6d2ff,#9f62dc);color:#190b23}
#toast{position:absolute;z-index:35;left:50%;top:50%;font-size:31px;font-weight:1000;color:#ffe16d;text-shadow:0 4px 14px #000;opacity:0;pointer-events:none}
#toast.show{animation:toast .65s ease-out}@keyframes toast{0%{opacity:0;transform:translate(-50%,-50%) scale(.5)}25%{opacity:1;transform:translate(-50%,-65%) scale(1.15)}100%{opacity:0;transform:translate(-50%,-100%) scale(1)}}
</style>
</head>
<body>
<div id="app">
<div class="top">
 <div class="panel logo">🍪 MERGE<span>WORLD</span></div>
 <div class="panel"><div class="scoreLabel">СЧЁТ</div><div class="score" id="score">0</div><div class="scoreLabel">🏆 РЕКОРД <b id="best">0</b></div></div>
 <div class="panel"><div class="nextLabel">СЛЕДУЮЩИЙ</div><div class="nextEmoji" id="next">🍪</div></div>
</div>
<div class="controls">
 <div class="group"><button class="ctrl" id="sound">🔊</button><button class="ctrl" id="music">♪</button></div>
 <div class="group"><button class="ctrl" id="full">⛶</button><button class="ctrl" id="pause">Ⅱ</button></div>
</div>
<button class="modeBtn" id="modeBtn">РЕЖИМ 1 · БАНКА</button>
<div class="categories" id="categories"></div>

<div class="stage" id="stage">
 <div class="container jar" id="jar"><div class="neck"></div><div class="danger"></div><div class="aim"></div><div class="aimDot"></div><div id="pieces"></div></div>
 <div class="container flask hidden" id="flask"><div class="neck"></div><div class="lip"></div><div class="body"><div class="danger"></div><div class="aim"></div><div class="aimDot"></div><div id="pieces2"></div></div></div>
</div>
<div class="bottom" id="levels"></div>
<div id="toast"></div>

<div class="overlay" id="menu">
 <div class="coverGlow g1"></div><div class="coverGlow g2"></div><div class="coverGlow g3"></div>
 <div class="card coverCard">
   <div class="coverTitle"><span>MERGE</span><b>WORLD</b></div>
   <div class="coverTag">СОЕДИНЯЙ • СОЗДАВАЙ • ОТКРЫВАЙ</div>
   <div class="coverScene">
     <div class="coverOrb o1">🍎</div>
     <div class="coverOrb o2">🚗</div>
     <div class="coverOrb o3">🦁</div>
     <div class="coverOrb o4">🍉</div>
     <div class="coverOrb o5">🏎️</div>
     <div class="coverOrb o6">🐼</div>
     <div class="coverOrb o7">🦸</div>
     <div class="coverOrb o8">🍓</div>
     <div class="coverCore">🍪</div>
   </div>
   <div class="coverTypes">
     <span>🍓 ФРУКТЫ</span><span>🚗 МАШИНЫ</span><span>🐾 ЖИВОТНЫЕ</span><span>🎭 ПЕРСОНАЖИ</span>
   </div>
   <p class="sub">Объединяй одинаковые предметы<br>и открывай всё более редкие уровни!</p>
   <button class="btn" id="start">ИГРАТЬ</button>
 </div>
</div>
<div class="overlay hidden" id="over"><div class="card"><div class="big">💥</div><h1>ИГРА ОКОНЧЕНА</h1><p class="sub">Счёт: <b id="final">0</b><br>Рекорд: <b id="finalBest">0</b></p><button class="btn" id="again">ИГРАТЬ СНОВА</button></div></div>
</div>

<script>
const SETS={
 sweets:{name:'🍰 Сладости',items:['🍪','🧁','🍩','🍰','🍫','🍦','🍭','🍉','🍍']},
 fruit:{name:'🍓 Фрукты',items:['🍓','🍒','🍊','🍋','🍌','🍎','🍐','🍇','🍉']},
 veg:{name:'🥕 Овощи',items:['🥕','🌽','🥒','🍅','🫑','🥦','🥬','🥔','🎃']},
 cars:{name:'🚗 Машины',items:['🚲','🛵','🏍️','🚗','🚕','🚙','🚌','🚓','🏎️']},
 animals:{name:'🐾 Животные',items:['🐭','🐰','🐱','🐶','🦊','🐼','🦁','🐯','🐲']},
 cartoons:{name:'🎭 Персонажи',items:['🤖','👻','🧙','🧛','🥷','🦸','🦹','👽','🐲']}
};
const categories=document.getElementById('categories');
let category='sweets';
let active=1,items=[],score=0,nextLv=0,running=false,paused=false,cool=.25,aim=.5,last=0;
let best=+localStorage.getItem('mergeworld_best')||0;document.getElementById('best').textContent=best;
let sound=localStorage.getItem('mergeworld_sound')!=='0',music=localStorage.getItem('mergeworld_music')!=='0';
const AC=window.AudioContext||window.webkitAudioContext;let ac=null;
function tone(f,d=.07,v=.035,type='sine'){if(!sound||!AC)return;if(!ac)ac=new AC;if(ac.state==='suspended')ac.resume();let o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.value=f;g.gain.value=v;g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+d);o.connect(g).connect(ac.destination);o.start();o.stop(ac.currentTime+d)}
document.getElementById('sound').textContent=sound?'🔊':'🔇';document.getElementById('music').textContent=music?'♫':'♪';

function setData(){return SETS[category]}
function renderCategories(){categories.innerHTML=Object.entries(SETS).map(([k,v])=>`<button class="cat ${k===category?'active':''}" data-k="${k}">${v.name}</button>`).join('');categories.querySelectorAll('.cat').forEach(b=>b.onclick=()=>{category=b.dataset.k;renderCategories();clearItems();renderLevels();nextRandom();if(running)cool=.35})}
function renderLevels(){document.getElementById('levels').innerHTML=setData().items.map(x=>`<span class="level">${x}</span>`).join('')}
function nextRandom(){nextLv=Math.floor(Math.random()*5);document.getElementById('next').textContent=setData().items[nextLv]}
function container(){return active===1?document.getElementById('jar'):document.querySelector('#flask .body')}
function pieces(){return active===1?document.getElementById('pieces'):document.getElementById('pieces2')}
function geom(){return container().getBoundingClientRect()}
function clearItems(){items.forEach(o=>o.el.remove());items=[]}
function reset(){clearItems();score=0;document.getElementById('score').textContent='0';nextRandom();renderLevels();running=true;paused=false;cool=.25;document.getElementById('menu').classList.add('hidden');document.getElementById('over').classList.add('hidden');document.getElementById('pause').textContent='Ⅱ'}
function make(lv,x,y,vy=0,vx=0){let g=geom(),o={lv,x,y,r:18+lv*6,vx,vy,dead:false,el:document.createElement('div')};x=Math.max(o.r+4,Math.min(g.width-o.r-4,x));y=Math.max(o.r+4,Math.min(g.height-o.r-4,y));o.el.className='piece pop';o.el.textContent=setData().items[lv];o.el.style.width=(o.r*2.1)+'px';o.el.style.height=(o.r*2.1)+'px';o.el.style.fontSize=(o.r*1.16)+'px';pieces().appendChild(o.el);items.push(o)}
function pos(o){o.el.style.transform=`translate(${o.x-o.r*1.05}px,${o.y-o.r*1.05}px)`}
function drop(){let g=geom();make(nextLv,g.width*aim,18,20,0);nextRandom();tone(130,.05,.018,'square')}
function merge(a,b){a.dead=b.dead=true;let lv=a.lv+1,x=(a.x+b.x)/2,y=(a.y+b.y)/2;if(lv<9)make(lv,x,y,-250,(a.vx+b.vx)/2);let gain=(lv+1)*(lv+1)*10;score+=gain;document.getElementById('score').textContent=score;if(score>best){best=score;document.getElementById('best').textContent=best;localStorage.setItem('mergeworld_best',best)}let q=document.createElement('div');q.className='burst';q.textContent=lv>=7?'✨💥':'✨';q.style.left=x+'px';q.style.top=y+'px';pieces().appendChild(q);setTimeout(()=>q.remove(),650);let t=document.getElementById('toast');t.textContent='+'+gain;t.classList.remove('show');void t.offsetWidth;t.classList.add('show');tone(280+lv*65,.08,.04);setTimeout(()=>tone(480+lv*80,.13,.045,'triangle'),45)}
function physics(dt){
let g=geom(),pad=4;
for(let o of items){
  o.vy+=920*dt;o.x+=o.vx*dt;o.y+=o.vy*dt;o.vx*=.995;
  if(o.x<o.r+pad){o.x=o.r+pad;o.vx=Math.abs(o.vx)*.45}
  if(o.x>g.width-o.r-pad){o.x=g.width-o.r-pad;o.vx=-Math.abs(o.vx)*.45}
  if(o.y<o.r+pad){o.y=o.r+pad;if(o.vy<0)o.vy=0}
  if(o.y>g.height-o.r-pad){o.y=g.height-o.r-pad;o.vy=-Math.abs(o.vy)*.22}
}
for(let i=0;i<items.length;i++)for(let j=i+1;j<items.length;j++){
  let a=items[i],b=items[j];if(a.dead||b.dead)continue;
  let dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy)||.001,min=a.r+b.r;
  if(d<min){
    if(a.lv===b.lv&&d<min*.86){merge(a,b);continue}
    let nx=dx/d,ny=dy/d,ov=min-d;
    a.x-=nx*ov*.5;a.y-=ny*ov*.5;b.x+=nx*ov*.5;b.y+=ny*ov*.5;
    a.x=Math.max(a.r+pad,Math.min(g.width-a.r-pad,a.x));
    b.x=Math.max(b.r+pad,Math.min(g.width-b.r-pad,b.x));
    a.y=Math.max(a.r+pad,Math.min(g.height-a.r-pad,a.y));
    b.y=Math.max(b.r+pad,Math.min(g.height-b.r-pad,b.y));
    let rel=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
    if(rel<0){let imp=-rel*.28;a.vx-=nx*imp;a.vy-=ny*imp;b.vx+=nx*imp;b.vy+=ny*imp}
  }
}
items=items.filter(o=>{if(o.dead){o.el.remove();return false}pos(o);return true});
let bad=items.some(o=>o.y-o.r<g.height*.15&&Math.abs(o.vy)<28);
if(bad){cool+=dt;if(cool>2.3)gameOver()}else cool=0
}
function gameOver(){if(!running)return;running=false;tone(110,.22,.035,'sawtooth');document.getElementById('final').textContent=score;document.getElementById('finalBest').textContent=best;document.getElementById('over').classList.remove('hidden')}
function pointer(e){let g=geom(),x=e.clientX??e.touches?.[0]?.clientX??innerWidth/2;aim=Math.max(.07,Math.min(.93,(x-g.left)/g.width));let c=container();c.querySelector('.aim').style.left=(aim*100)+'%';c.querySelector('.aimDot').style.left=(aim*100)+'%'}
const stage=document.getElementById('stage');stage.addEventListener('pointermove',pointer);stage.addEventListener('pointerdown',e=>{pointer(e);if(running&&!paused&&cool<=0){drop();cool=.42}});stage.addEventListener('touchmove',e=>{pointer(e);e.preventDefault()},{passive:false});
document.getElementById('modeBtn').onclick=()=>{active=active===1?2:1;document.getElementById('jar').classList.toggle('hidden',active!==1);document.getElementById('flask').classList.toggle('hidden',active!==2);document.getElementById('app').classList.toggle('mode2',active===2);document.getElementById('modeBtn').textContent=active===1?'РЕЖИМ 1 · БАНКА':'РЕЖИМ 2 · ЧЁРНАЯ КОЛБА';clearItems();cool=.35};
document.getElementById('start').onclick=reset;document.getElementById('again').onclick=reset;
document.getElementById('pause').onclick=()=>{if(running){paused=!paused;document.getElementById('pause').textContent=paused?'▶':'Ⅱ'}};
document.getElementById('sound').onclick=()=>{sound=!sound;localStorage.setItem('mergeworld_sound',sound?'1':'0');document.getElementById('sound').textContent=sound?'🔊':'🔇';if(sound)tone(520)};
document.getElementById('music').onclick=()=>{music=!music;localStorage.setItem('mergeworld_music',music?'1':'0');document.getElementById('music').textContent=music?'♫':'♪';if(music)tone(660,.1,.025)};
document.getElementById('full').onclick=async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else if(document.documentElement.requestFullscreen)await document.documentElement.requestFullscreen()}catch(e){}};
function loop(t){let dt=Math.min((t-last)/1000,.033);last=t;if(running&&!paused){physics(dt);cool=Math.max(0,cool-dt)}requestAnimationFrame(loop)}
renderCategories();renderLevels();nextRandom();requestAnimationFrame(loop);
</script>
</body></html>
