<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>MERGE WORLD</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090a0f;color:#fff;font-family:Arial,Helvetica,sans-serif}
button,input{font:inherit}
#app{height:100%;display:flex;flex-direction:column}
header{height:62px;display:flex;align-items:center;justify-content:space-between;padding:8px 12px;position:relative;z-index:20;background:rgba(8,9,14,.88);backdrop-filter:blur(12px);border-bottom:1px solid rgba(255,255,255,.1)}
.title{font-weight:900;letter-spacing:1px}
.stat{font-size:12px;opacity:.85;text-align:center}
.stat b{display:block;font-size:20px;opacity:1}
.iconBtn{width:44px;height:44px;border-radius:14px;border:1px solid rgba(255,255,255,.16);background:rgba(255,255,255,.08);color:white;font-size:22px}
main{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center}
.screen{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center}
.screen.active{display:flex}
canvas{touch-action:none;display:block}
#gameCanvas{width:min(100vw,520px);height:100%;max-height:calc(100vh - 62px);background:transparent}
#cover{position:absolute;inset:0;z-index:10;display:flex;align-items:center;justify-content:center;background:radial-gradient(circle at 50% 35%,#2a1a0b,#090a0f 58%)}
.coverCard{width:min(92vw,500px);padding:28px 18px;border-radius:28px;text-align:center;background:rgba(10,10,14,.72);border:1px solid rgba(255,255,255,.13);box-shadow:0 25px 80px #000}
.coverTitle{font-size:42px;font-weight:1000;letter-spacing:2px}
.coverSub{opacity:.7;margin:8px 0 20px}
.primary{border:0;border-radius:18px;padding:14px 24px;background:linear-gradient(135deg,#ffcf33,#ff7a00);font-weight:900;color:#15100a}
#menu{position:absolute;top:70px;right:10px;z-index:30;width:min(92vw,360px);max-height:calc(100% - 80px);overflow:auto;padding:12px;border-radius:22px;background:rgba(12,13,18,.96);border:1px solid rgba(255,255,255,.15);box-shadow:0 25px 80px #000;display:none}
#menu.open{display:block}
.menuTitle{font-weight:900;margin:4px 2px 10px}
.menuRow{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.mBtn{flex:1;min-width:100px;border:1px solid rgba(255,255,255,.12);background:#171922;color:#fff;border-radius:12px;padding:10px}
.mBtn.on{background:#ff9d18;color:#111;font-weight:900}
.range{width:100%}
.section{border-top:1px solid rgba(255,255,255,.08);padding-top:10px;margin-top:8px}
.small{font-size:12px;opacity:.65}
input[type=file]{width:100%;padding:12px;background:#151720;border-radius:12px;color:#fff;border:1px dashed rgba(255,255,255,.2)}
.audioName{font-size:12px;margin-top:7px;word-break:break-all;color:#ffd76b}
.layerTabs{display:flex;gap:6px;overflow:auto;padding:5px 0}
.layerTabs button{white-space:nowrap;border:1px solid rgba(255,255,255,.12);background:#151720;color:#fff;border-radius:11px;padding:8px 10px}
.layerTabs button.on{background:#fff;color:#111}
#toast{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);z-index:40;padding:10px 14px;border-radius:14px;background:#111b;color:#fff;border:1px solid #fff2;display:none}
</style>
</head>
<body>
<div id="app">
<header>
  <button class="iconBtn" id="backBtn">←</button>
  <div class="title">MERGE WORLD</div>
  <div class="stat">SCORE<b id="score">0</b></div>
  <div class="stat">BEST<b id="best">0</b></div>
  <button class="iconBtn" id="menuBtn">☰</button>
</header>
<main>
  <div id="cover">
    <div class="coverCard">
      <div class="coverTitle">MERGE WORLD</div>
      <div class="coverSub">Собирай одинаковые предметы и объединяй их</div>
      <button class="primary" id="startBtn">ИГРАТЬ</button>
    </div>
  </div>
  <canvas id="gameCanvas"></canvas>
  <div id="menu">
    <div class="menuTitle">Настройки игры</div>
    <div class="menuRow">
      <button class="mBtn" data-mode="1">🫙 Стекло</button>
      <button class="mBtn" data-mode="2">🖤 Тёмное стекло</button>
      <button class="mBtn" data-mode="3">🌈 LED банка</button>
      <button class="mBtn" data-mode="4">🎵 Sound Lab</button>
    </div>
    <div class="section">
      <div class="small">Раздел / слой предметов</div>
      <div class="layerTabs" id="layers"></div>
    </div>
    <div class="section">
      <button class="mBtn" id="soundBtn">🔊 Звуки: ВКЛ</button>
      <button class="mBtn" id="musicBtn">🎵 Музыка: ВКЛ</button>
    </div>
    <div class="section">
      <div class="small">Громкость</div>
      <input class="range" id="vol" type="range" min="0" max="1" step=".01" value=".7">
    </div>
    <div class="section">
      <div class="small">Музыка / phonk</div>
      <input id="audioFile" type="file" accept="audio/*,.mp3,.wav,.m4a,.aac,.ogg,.opus">
      <div class="audioName" id="audioName">Музыка не выбрана</div>
      <div class="menuRow" style="margin-top:8px">
        <button class="mBtn" id="playAudio">▶ Играть</button>
        <button class="mBtn" id="stopAudio">■ Стоп</button>
      </div>
    </div>
    <div class="section">
      <button class="mBtn" id="pauseBtn">Ⅱ Пауза</button>
      <button class="mBtn" id="fullBtn">⛶ Полный экран</button>
    </div>
  </div>
  <div id="toast"></div>
</main>
</div>

<audio id="player" loop playsinline></audio>

<script>
const canvas=document.getElementById('gameCanvas'),ctx=canvas.getContext('2d');
const cover=document.getElementById('cover'),menu=document.getElementById('menu');
const scoreEl=document.getElementById('score'),bestEl=document.getElementById('best');
let W=0,H=0,dpr=1,mode=1,paused=false,score=0,best=+localStorage.mergeBest||0;
bestEl.textContent=best;

const layers={
 sweets:['🍪','🧁','🍩','🍰','🍫','🍦','🍭','🍬','🍮'],
 fruits:['🍓','🍒','🍊','🍋','🍌','🍎','🍐','🍇','🍉'],
 vegetables:['🥕','🌽','🥒','🍅','🫑','🥦','🥬','🥔','🎃'],
 cars:['Mercedes C-Class','BMW 3 Series','Audi A4','Lexus IS','Mercedes E-Class','BMW 5 Series','Audi A6','Mercedes GLC','BMW X3','Audi Q5','Lexus RX','Mercedes GLE','BMW X5','Audi Q7','Mercedes AMG C63','BMW M3','Audi RS6','Mercedes AMG E63','BMW M5','Audi RS7','Porsche 911','Mercedes S-Class','BMW 7 Series','Audi A8','Range Rover','Lamborghini Huracán','Ferrari 488','McLaren 720S','Mercedes G-Class','Bentley Continental','Rolls-Royce Ghost','Bugatti Chiron','Pagani Huayra','Koenigsegg Jesko','Bugatti Bolide'],
 animals:['🐭','🐰','🐱','🐶','🦊','🐼','🦁','🐯','🐨'],
 cartoons:['⭐','🦸','🦹','🤖','👻','🐙','🐢','🐲','🧙']
};
const prices=[100,150,200,250,300,350,400,450,500,550,600,700,800,900,1000,1200,1400,1600,1800,2000,2500,3000,3500,4000,4500,5000,6000,7000,8000,9000,10000,15000,20000,25000,30000];
let currentLayer='sweets', pieces=[], nextIndex=0, dropping=null, lastT=0, audioEnabled=true,musicEnabled=true;
let audioURL=null;
const player=document.getElementById('player');

function resize(){
 const r=canvas.getBoundingClientRect(); dpr=Math.min(2,devicePixelRatio||1); W=r.width; H=r.height;
 canvas.width=W*dpr; canvas.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
}
addEventListener('resize',resize); resize();

function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',1400)}
function setMode(m){mode=m;pieces=[];dropping=null;paused=false;document.querySelectorAll('[data-mode]').forEach(b=>b.classList.toggle('on',+b.dataset.mode===m));toast(m===3?'🌈 LED банка включена':m===4?'🎵 Sound Lab':m===1?'🫙 Стеклянная банка':'🖤 Тёмная стеклянная банка');}
function renderLayers(){
 const el=document.getElementById('layers');el.innerHTML='';
 Object.keys(layers).forEach(k=>{const b=document.createElement('button');b.textContent=k==='sweets'?'🍰 Сладости':k==='fruits'?'🍓 Фрукты':k==='vegetables'?'🥕 Овощи':k==='cars'?'🚗 Машины':k==='animals'?'🐾 Животные':'🎭 Мульт-стиль';b.className=k===currentLayer?'on':'';b.onclick=()=>{currentLayer=k;pieces=[];dropping=null;renderLayers()};el.appendChild(b)})
}
renderLayers();

function bank(){
 const cx=W/2, bw=Math.min(W*.78,360), top=35, bot=H-20;
 ctx.save();
 if(mode===3){
   ctx.shadowBlur=26; ctx.shadowColor=`hsl(${(Date.now()/8)%360},100%,60%)`;
   const g=ctx.createLinearGradient(cx-bw/2,0,cx+bw/2,0);
   g.addColorStop(0,'#ff3b81');g.addColorStop(.2,'#ffb300');g.addColorStop(.4,'#57ff65');g.addColorStop(.6,'#23d7ff');g.addColorStop(.8,'#7265ff');g.addColorStop(1,'#ff38e7');
   ctx.strokeStyle=g;ctx.lineWidth=10;
 }else{
   ctx.shadowBlur=mode===2?22:14;ctx.shadowColor=mode===2?'#7d55ff':'#bfe9ff';
   ctx.strokeStyle=mode===2?'#b9a8ff':'rgba(220,250,255,.9)';ctx.lineWidth=5;
 }
 const x=cx-bw/2;
 ctx.beginPath();ctx.moveTo(x+22,top);ctx.lineTo(x+8,top+28);ctx.quadraticCurveTo(x,top+48,x+8,top+70);
 ctx.lineTo(x+26,bot-20);ctx.quadraticCurveTo(x+32,bot,x+58,bot);
 ctx.lineTo(cx+bw/2-58,bot);ctx.quadraticCurveTo(cx+bw/2-32,bot,cx+bw/2-26,bot-20);
 ctx.lineTo(cx+bw/2-8,top+70);ctx.quadraticCurveTo(cx+bw/2,top+48,cx+bw/2-8,top+28);ctx.lineTo(cx+bw/2-22,top);ctx.closePath();ctx.stroke();
 ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(cx,top+5,bw/2-24,13,0,0,Math.PI*2);ctx.stroke();
 if(mode===1||mode===3){
   const fill=ctx.createLinearGradient(0,top,0,bot);fill.addColorStop(0,'rgba(255,255,255,.14)');fill.addColorStop(.5,'rgba(150,210,255,.06)');fill.addColorStop(1,'rgba(255,255,255,.12)');
   ctx.fillStyle=fill;ctx.fill();
 }
 ctx.restore();
 return {left:x+12,right:cx+bw/2-12,top:top+18,bottom:bot-12};
}
function bounds(){return bank()}

function carIcon(name,x,y,r){
 const colors=['#d8dde5','#111','#e8e8e8','#777','#c10d22','#1e67ff','#222','#eee','#0f6','#ffae00'];
 const i=layers.cars.indexOf(name);const c=colors[i%colors.length];
 ctx.save();ctx.translate(x,y);
 ctx.fillStyle=c;ctx.shadowBlur=12;ctx.shadowColor=c;
 ctx.beginPath();ctx.roundRect(-r,-r*.42,r*2,r*.75,8);ctx.fill();
 ctx.fillStyle='rgba(210,240,255,.8)';ctx.beginPath();ctx.moveTo(-r*.55,-r*.42);ctx.lineTo(-r*.25,-r*.82);ctx.lineTo(r*.45,-r*.82);ctx.lineTo(r*.68,-r*.42);ctx.closePath();ctx.fill();
 ctx.fillStyle='#111';ctx.beginPath();ctx.arc(-r*.55,r*.35,r*.23,0,7);ctx.arc(r*.55,r*.35,r*.23,0,7);ctx.fill();
 ctx.fillStyle='#fff';ctx.font=`900 ${Math.max(7,r*.27)}px Arial`;ctx.textAlign='center';ctx.fillText(name.split(' ')[0],0,.05*r);
 ctx.restore();
}
function drawPiece(p){
 if(currentLayer==='cars'){carIcon(p.name,p.x,p.y,p.r);return}
 ctx.save();ctx.translate(p.x,p.y);ctx.font=`${p.r*1.55}px "Apple Color Emoji","Segoe UI Emoji",sans-serif`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.shadowBlur=8;ctx.shadowColor=mode===3?`hsl(${(Date.now()/6)%360},100%,65%)`:mode===2?'#8d66ff':'#fff';ctx.fillText(p.name,0,0);ctx.restore();
}
function spawn(x){
 const arr=layers[currentLayer], idx=Math.min(nextIndex,arr.length-1);
 dropping={x,y:75,r:currentLayer==='cars'?24:18,name:arr[idx],index:idx,vy:0};
 nextIndex=(idx+1)%Math.min(arr.length,9);
}
function floorY(r){const b=bounds();return b.bottom-r}
function collide(p){
 const b=bounds();p.x=Math.max(b.left+p.r,Math.min(b.right-p.r,p.x));p.y=Math.min(floorY(p.r),p.y);
 for(const q of pieces){
   const dx=p.x-q.x,dy=p.y-q.y,d=Math.hypot(dx,dy),min=p.r+q.r;
   if(d<min && d>0){const push=(min-d)/2;p.x+=dx/d*push;p.y+=dy/d*push;q.x-=dx/d*push;q.y-=dy/d*push;p.vy*=.6}
 }
}
function mergeCheck(){
 for(let i=0;i<pieces.length;i++)for(let j=i+1;j<pieces.length;j++){
  const a=pieces[i],b=pieces[j]; if(a.name!==b.name)continue;
  if(Math.hypot(a.x-b.x,a.y-b.y)<(a.r+b.r)*.72){
    const arr=layers[currentLayer], idx=arr.indexOf(a.name);
    if(idx<0||idx>=arr.length-1){continue}
    const np={x:(a.x+b.x)/2,y:(a.y+b.y)/2,r:a.r*1.12,name:arr[idx+1],index:idx+1,vy:-3};
    pieces.splice(j,1);pieces.splice(i,1);pieces.push(np);score+=Math.round((idx+1)*100);scoreEl.textContent=score;
    if(score>best){best=score;bestEl.textContent=best;localStorage.mergeBest=best}
    beep(500+idx*60,.12);return true;
  }
 }
 return false;
}
function beep(freq,dur){
 if(!audioEnabled)return;
 try{const ac=beep.ac||(beep.ac=new AudioContext());const o=ac.createOscillator(),g=ac.createGain();o.frequency.value=freq;o.type='sine';g.gain.setValueAtTime(.04,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch(e){}
}
function tick(t){
 if(!lastT)lastT=t;const dt=Math.min(.025,(t-lastT)/1000);lastT=t;
 ctx.clearRect(0,0,W,H);
 if(mode===4){drawSoundScene();requestAnimationFrame(tick);return}
 bank();
 if(!paused){
  for(const p of pieces){p.vy+=500*dt;p.y+=p.vy*dt;collide(p)}
  if(dropping){dropping.vy+=500*dt;dropping.y+=dropping.vy*dt;collide(dropping)}
  mergeCheck();
 }
 for(const p of pieces)drawPiece(p);
 if(dropping)drawPiece(dropping);
 requestAnimationFrame(tick);
}
function drawSoundScene(){
 const g=ctx.createRadialGradient(W/2,H*.42,10,W/2,H*.42,Math.max(W,H)*.7);g.addColorStop(0,'#34105a');g.addColorStop(.5,'#0d1430');g.addColorStop(1,'#05060a');ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
 ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='900 34px Arial';ctx.fillText('SOUND LAB',W/2,H*.25);
 ctx.font='18px Arial';ctx.fillStyle='#bca8ff';ctx.fillText('Добавь свою музыку или phonk',W/2,H*.25+36);
 for(let i=0;i<36;i++){const x=20+i*(W-40)/35;const h=20+Math.abs(Math.sin(Date.now()/250+i))*100;ctx.fillStyle=`hsl(${(i*12+Date.now()/20)%360},90%,60%)`;ctx.fillRect(x,H*.6-h/2,5,h)}
}
canvas.addEventListener('pointerdown',e=>{
 if(mode===4)return;
 const r=canvas.getBoundingClientRect(),x=e.clientX-r.left;
 if(!dropping){spawn(Math.max(30,Math.min(W-30,x)));return}
 if(dropping){pieces.push({...dropping});dropping=null;beep(180,.07)}
});
document.getElementById('startBtn').onclick=()=>{cover.style.display='none';spawn(W/2);beep(440,.1)};
document.getElementById('menuBtn').onclick=()=>menu.classList.toggle('open');
document.getElementById('backBtn').onclick=()=>{if(mode===4){setMode(1);return}cover.style.display='flex'};
document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{setMode(+b.dataset.mode);if(+b.dataset.mode!==4)cover.style.display='none'});
document.getElementById('soundBtn').onclick=()=>{audioEnabled=!audioEnabled;document.getElementById('soundBtn').textContent='🔊 Звуки: '+(audioEnabled?'ВКЛ':'ВЫКЛ')};
document.getElementById('musicBtn').onclick=()=>{musicEnabled=!musicEnabled;document.getElementById('musicBtn').textContent='🎵 Музыка: '+(musicEnabled?'ВКЛ':'ВЫКЛ');if(!musicEnabled)player.pause()};
document.getElementById('vol').oninput=e=>player.volume=+e.target.value;
document.getElementById('pauseBtn').onclick=()=>{paused=!paused;document.getElementById('pauseBtn').textContent=paused?'▶ Продолжить':'Ⅱ Пауза'};
document.getElementById('fullBtn').onclick=()=>document.documentElement.requestFullscreen?.();

document.getElementById('audioFile').addEventListener('change',e=>{
 const f=e.target.files?.[0];if(!f)return;
 if(!f.type.startsWith('audio/') && !/\.(mp3|wav|m4a|aac|ogg|opus)$/i.test(f.name)){toast('Выбери аудиофайл');return}
 if(audioURL)URL.revokeObjectURL(audioURL);
 audioURL=URL.createObjectURL(f);player.src=audioURL;player.volume=+document.getElementById('vol').value;
 document.getElementById('audioName').textContent='✓ '+f.name;
 toast('Музыка добавлена');
});
document.getElementById('playAudio').onclick=async()=>{if(!player.src){toast('Сначала выбери музыку');return}try{await player.play();toast('▶ Музыка играет')}catch(e){toast('Нажми ещё раз после выбора файла')}};
document.getElementById('stopAudio').onclick=()=>{player.pause();player.currentTime=0};

renderLayers(); setMode(1); requestAnimationFrame(tick);
</script>
</body>
</html>
